name: tests
on:
  push:
  pull_request:
jobs:
  text-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy
      - run: python tests/test_arabic.py
